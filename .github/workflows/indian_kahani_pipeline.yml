name: Automated Indian Hindi Kahani Long-Form Pipeline (16:9)

on:
  schedule:
    # Runs daily at 06:30 UTC (12:00 PM IST) and 14:30 UTC (8:00 PM IST)
    - cron: '30 6,14 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom Hindi story topic (leave blank to auto-pick next numbered story from Panchatantra 101+)'
        required: false
        default: ''
      max_ai_images:
        description: 'Maximum AI images per story (default 20 using free Cloudflare Worker API)'
        required: false
        default: '60'
      dry_run:
        description: 'Skip YouTube upload (true = render preview MP4 artifact only, false = publish to YouTube)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: indian-kahani-longform-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload-kahani:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore reusable media cache
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: kahani-media-${{ runner.os }}-${{ hashFiles('data/topics_seed.json') }}
          restore-keys: |
            kahani-media-${{ runner.os }}-

      - name: Set up System Dependencies (FFmpeg & Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-indic fonts-dejavu-core libmagic1
          fc-cache -fv

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Unit & Syntax Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Synthesize Indian Storytelling Raag Bhupali Score & Chimes
        run: |
          python src/sfx_generator.py

      - name: Run End-to-End 16:9 Hindi Kahani Pipeline
        env:
          FREE_IMAGE_API_URL: ${{ secrets.FREE_IMAGE_API_URL }}
          FREE_IMAGE_API_KEY: ${{ secrets.FREE_IMAGE_API_KEY }}
          FREE_IMAGE_MODEL: ${{ secrets.FREE_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'centralindia' }}
          AZURE_TTS_VOICE: ${{ secrets.AZURE_TTS_VOICE || 'hi-IN-MadhurNeural' }}
          AZURE_TTS_FEMALE_VOICE: ${{ secrets.AZURE_TTS_FEMALE_VOICE || 'hi-IN-SwaraNeural' }}
          BG_MUSIC_VOLUME: ${{ secrets.BG_MUSIC_VOLUME || '0.16' }}
          BGM_URL: ${{ secrets.BGM_URL || '' }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_IMAGE_MODEL: ${{ secrets.FOUNDRY_IMAGE_MODEL || 'MAI-Image-2.6-Flash' }}
          MAX_AI_IMAGES_PER_VIDEO: ${{ github.event.inputs.max_ai_images || vars.MAX_AI_IMAGES_PER_VIDEO || secrets.MAX_AI_IMAGES_PER_VIDEO || '60' }}
          FOUNDRY_TEXT_API_KEY: ${{ secrets.FOUNDRY_TEXT_API_KEY }}
          FOUNDRY_TEXT_ENDPOINT: ${{ secrets.FOUNDRY_TEXT_ENDPOINT }}
          FOUNDRY_TEXT_MODEL: ${{ secrets.FOUNDRY_TEXT_MODEL || 'gpt-6-luna' }}
          VOICE_SPEED_PERCENT: ${{ secrets.VOICE_SPEED_PERCENT || '0' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          MEDIA_CACHE_DIR: .cache/media
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || secrets.DRY_RUN || 'false' }}
        run: |
          python src/main.py

      - name: Upload Rendered 16:9 Hindi Story Video as Workflow Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/final_story.mp4') != ''
        with:
          name: rendered-hindi-kahani-${{ github.run_id }}
          path: |
            output/final_story.mp4
            output/subtitles.ass
            output/metadata.json
            output/quality_report.json
          retention-days: 7

      - name: Commit Updated Story Queue & History State (Backup Sync)
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Indian Kahani Auto-Bot"
          git add data/used_topics.json data/upload_history.json data/topics_seed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record completed Hindi Kahani [skip ci]"
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 2
          done
